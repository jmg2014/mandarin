<!doctype html>
<html lang="en">
<head><meta charset="utf-8"><title>Skill tests</title></head>
<body>
<pre id="out"></pre>
<script>try { localStorage.removeItem("mandarin-tw-v1"); } catch(e){}</script>
<script src="../shared/progress.js"></script>
<script src="../shared/engine.js"></script>
<script src="../shared/zh.js"></script>
<script src="../shared/tocfl.js"></script>
<script src="../shared/words.js"></script>
<script src="../shared/topic.js"></script>
<script src="../tones/skills.js"></script>
<script src="../numbers/skills.js"></script>
<script src="../words/skills.js"></script>
<script src="../phrases/skills.js"></script>
<script src="../sentences/skills.js"></script>
<script src="../sentences/little.js"></script>
<script src="../dialogues/skills.js"></script>
<script>
/* Generates many questions for every skill and level and checks each one:
   - well formed for its input (the answer is among the choices, the number is digits, the cards have pinyin…)
   - no repeated choices, nothing left as "undefined"
   - what is spoken is what the transcript shows
   Every (characters, pinyin) pair goes to PAIRS, for tests/check.py to check the pinyin and the TOCFL level.
   Run with tests/check.py. */
const out = []; let fails = 0, count = 0;
const fail = m => { fails++; if (fails < 80) out.push("FAIL " + m); };
const eq = (name, got, want) => { if (got !== want) fail(`${name}: got ${JSON.stringify(got)}, want ${JSON.stringify(want)}`); else out.push("PASS " + name); };
const pairs = new Map();
const addPair = (zh, py) => { zh = String(zh).trim(); py = String(py).trim(); if (zh && /[一-鿿]/.test(zh)) pairs.set(zh + "\u0001" + py, [zh, py]); };
function pairsFromHtml(html){
  const d = document.createElement("div"); d.innerHTML = html || "";
  return [...d.querySelectorAll(".tline")].map(t => [t.querySelector(".hz") && t.querySelector(".hz").textContent, t.querySelector(".py") && t.querySelector(".py").textContent]);
}

/* ---- numbers in characters and pinyin ---- */
[[0, "零"], [2, "二"], [10, "十"], [12, "十二"], [20, "二十"], [105, "一百零五"], [110, "一百一十"], [200, "兩百"], [350, "三百五十"],
 [1005, "一千零五"], [1050, "一千零五十"], [1200, "一千兩百"], [2000, "兩千"], [2030, "兩千零三十"], [10050, "一萬零五十"], [20000, "兩萬"]]
  .forEach(([n, zh]) => eq(`ZH.num(${n})`, ZH.num(n).zh, zh));
eq("ZH.num(350).py", ZH.num(350).py, "sānbǎi wǔshí");
eq("ZH.num(12).py", ZH.num(12).py, "shí'èr");
eq("ZH.num(1005).py", ZH.num(1005).py, "yìqiān líng wǔ");
eq("ZH.price(2)", ZH.price(2).zh, "兩塊");
eq("ZH.qty(1, 'ge')", ZH.qty(1, "ge").py, "yí");
eq("ZH.qty(1, 'bēi')", ZH.qty(1, "bēi").py, "yì");
eq("ZH.time(2,0)", ZH.time(2, 0).zh, "兩點");
eq("ZH.time(3,30,half)", ZH.time(3, 30, true).zh, "三點半");
eq("ZH.time(3,5)", ZH.time(3, 5).zh, "三點零五分");
eq("ZH.time(12,0,noon)", ZH.time(12, 0, false, "noon").zh, "中午十二點");
eq("ZH.date(5,10)", ZH.date(5, 10).zh, "五月十號");
eq("ZH.setTone('ma',3)", ZH.setTone("ma", 3), "mǎ");
eq("ZH.setTone('gou',3)", ZH.setTone("gou", 3), "gǒu");
eq("ZH.setTone('lü',4)", ZH.setTone("lü", 4), "lǜ");
eq("ZH.toneOf('hǎo')", ZH.toneOf("hǎo"), 3);
eq("ZH.toneOf('ma')", ZH.toneOf("ma"), 0);
// the tone-pair words split into two syllables whose tones are known
ZH._toneWords.forEach(w => { if (w.parts.length !== 2 || !w.parts[1] || w.tones.includes(0)) fail(`tone word ${w.zh} ${w.py}: split ${JSON.stringify(w.parts)}`); });

/* ---- every skill, every level ---- */
const N = 150;
for (const T of ZH.TOPICS) for (const skill of T.skills) for (const lv of [1, 2, 3]){
  for (let i = 0; i < N; i++){
    let q;
    try { q = skill.make(lv); } catch(e){ fail(`${skill.id} L${lv}: threw ${e.message}`); break; }
    count++;
    const where = `${skill.id} L${lv} ${JSON.stringify(q.say).slice(0, 60)}`;
    const blob = JSON.stringify([q.text, q.say, q.choices, q.answer, q.reveal, q.items, q.solution]);
    if (/undefined|NaN|\[object|\{[wpeP]\}/.test(blob)) fail(where + ": undefined or placeholder in " + blob.slice(0, 200));
    if (!q.say || (Array.isArray(q.say) && !q.say.length)) fail(where + ": nothing to hear");
    if (!q.text) fail(where + ": no question text");
    const m = q.input || "choice";
    if (m === "choice"){
      if (!Array.isArray(q.choices) || q.choices.length < 2) fail(where + ": needs 2+ choices");
      else {
        if (new Set(q.choices).size !== q.choices.length) fail(where + ": repeated choice " + q.choices);
        if (!q.choices.includes(q.answer)) fail(where + ": answer not among choices " + q.answer + " / " + q.choices);
        if (q.choices.length > 4) fail(where + ": more than 4 choices");
      }
    }
    if (m === "num" && !/^[0-9]+$/.test(q.answer)) fail(where + ": number answer isn't digits: " + q.answer);
    if (m === "order"){
      if (!q.items || q.items.length < 2) fail(where + ": needs 2+ cards");
      else q.items.concat(q.extra || []).forEach(it => { if (!/^[^|]+\|[^|]+$/.test(it)) fail(where + ": card without pinyin " + it); });
      if ((q.extra || []).some(x => q.items.includes(x))) fail(where + ": a decoy card is also in the sentence");
    }
    // what is heard = what the transcript shows
    const lines = pairsFromHtml(q.reveal);
    lines.forEach(([zh, py]) => addPair(zh, py));
    if (typeof q.say === "string"){
      if (!lines.length) fail(where + ": no transcript");
      else if (!lines.some(([zh]) => zh === q.say)) fail(where + ": spoken text isn't in the transcript: " + q.say);
    } else {
      q.say.forEach(L => { if (L.py) addPair(L.t, L.py); else if (!lines.some(([zh]) => zh === L.t)) fail(where + ": line without transcript " + L.t); });
      if (q.bubbles && q.say.some(L => !L.py || !L.en)) fail(where + ": a conversation line without pinyin or meaning");
    }
    if (m === "order") addPair(q.items.map(x => x.split("|")[0]).join(""), q.items.map(x => x.split("|")[1]).join(" "));
  }
}
// all word-bank words and their sentences, and every hand-written phrase and question
Object.keys(ZH.WORDS).forEach(th => ZH.wordList(th).forEach(w => { addPair(w.zh, w.py); ZH.framesOf(w).forEach(f => addPair(f.zh, f.py)); }));
ZH.TOPICS.forEach(T => T.skills.forEach(s => {
  (s.phrases || []).forEach(p => { addPair(p.zh, p.py); if (p.reply) addPair(p.reply.zh, p.reply.py); });
  (s.questions || []).forEach(p => { addPair(p.zh, p.py); addPair(p.ans.zh, p.ans.py); });
  (s.bank || []).forEach(b => {
    addPair(b.zh, b.py);
    if (!b.ok) fail(`${s.id} "${b.zh}": the characters and the pinyin are split into a different number of words`);
    if (b.wrong.length !== 3 || new Set([b.en, ...b.wrong]).size !== 4) fail(`${s.id} "${b.zh}": needs 3 different wrong meanings`);
  });
  (s.dialogues || []).forEach(d => {
    d.lines.forEach(L => addPair(L[1], L[2]));
    [1, 2, 3].forEach(lv => { if (!d.qs.some(q => q.lv === lv) && !s.dialogues.some(x => x.qs.some(q => q.lv === lv))) fail(`${s.id}: no level ${lv} question`); });
    d.qs.forEach(q => { if (q.c && new Set(q.c).size !== q.c.length) fail(`${s.id} ${d.title}: repeated choice`); });
  });
}));
// every sentence pattern: all slot combinations that build give distinct English for distinct Chinese
const P = ZH._patterns;
[P.SHI, P.YAO, P.LIKE, P.YOU, P.ZAI_WHO, P.ZAI_WHERE, P.QU].forEach((pat, n) => {
  const byEn = new Map();
  for (let i = 0; i < 3000; i++){
    const s = P.sentence(pat, P.randomV(pat)); if (!s) continue;
    addPair(s.zh, s.py);
    if (byEn.has(s.en) && byEn.get(s.en) !== s.zh) fail(`pattern ${n}: "${s.en}" for both ${byEn.get(s.en)} and ${s.zh}`);
    byEn.set(s.en, s.zh);
  }
});
// things a native speaker found wrong once: they must never come back
const allZh = [...pairs.values()].map(x => x[0]);
const bad = [[/吃湯/, "soup is 喝, not 吃"], [/給我.{1,3}(個人|隻貓)|我要.{1,3}(個人|隻貓)/, "asking for people or cats"],
  [/((^|[^十])(四|六|九)|十一)月三十一[號日]|(^|[^十])二月(二十九|三十)/, "a date that doesn't exist"], [/爺爺今年(十|二十|三十|四十|五十)/, "a grandpa that young"],
  [/早上(九|十|十一)點/, "早上 after 9 (Taiwan says 上午)"], [/坐公車去(台北|台中|高雄|台南|花蓮)|騎機車去(台北|台中|高雄|台南|花蓮)/, "a city bus or scooter between cities"],
  [/下個月.{0,4}去(夜市|公園|超市)/, "planning the supermarket a month ahead"], [/車站在樓|洗手間在對面/, "an odd place"],
  [/(狗|貓)，?它/, "它 for an animal (Taiwan writes 牠)"], [/做飯/, "做飯 (Taiwan says 煮飯)"]];
for (const [re, why] of bad){ const hit = allZh.find(z => re.test(z)); if (hit) fail(`${why}: ${hit}`); else out.push("PASS never: " + why); }
out.push(`PASS generated ${count} questions`);
out.push(fails ? `FAIL ${fails} problems` : "PASS all questions are well formed");
out.push("PAIRS " + JSON.stringify([...pairs.values()]));
out.push("DONE");
document.getElementById("out").textContent = out.join("\n");
</script>
</body>
</html>
